# TODO: replace OWNER/docengine with the final engine repository owner/name, and pin a released tag instead of v1.
# pull_request_target runs in the base repository context. This job never checks out PR code.
name: PR preview cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    uses: OWNER/docengine/.github/workflows/pr-preview-cleanup.yml@v1
    with:
      engine-repository: OWNER/docengine
      engine-ref: v1
    permissions:
      contents: write
      pull-requests: write