# TODO: replace OWNER/docengine with the final engine repository owner/name, and pin a released tag instead of v1.
name: PR preview prune

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    uses: OWNER/docengine/.github/workflows/pr-preview-prune.yml@v1
    with:
      engine-repository: OWNER/docengine
      engine-ref: v1
    permissions:
      contents: write
      pull-requests: read