# TODO: replace OWNER/docengine with the final engine repository owner/name, and pin a released tag instead of v1.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# The newest push to a PR always wins.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    uses: OWNER/docengine/.github/workflows/pr-preview.yml@v1
    with:
      engine-repository: OWNER/docengine
      engine-ref: v1
      # typst-version: "0.13.1"
    permissions:
      contents: read