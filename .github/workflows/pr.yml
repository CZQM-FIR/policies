# PLACEHOLDER caller workflow. The reusable workflows in the docengine repo are still being written
# (see action/ in the engine repo); align the path, inputs and version with action/examples/ once it exists.
# TODO: replace OWNER/docengine with the final engine repo owner/name, and pin a released tag.
name: Policy PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  docs:
    uses: OWNER/docengine/.github/workflows/pr.yml@v0 # TODO: final owner/name and pinned tag
