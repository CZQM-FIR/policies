name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: jackkoskie/docengine/.github/workflows/release.yml@v0.1.1
    with:
      engine-repository: jackkoskie/docengine
      engine-ref: v0.1.1
    permissions:
      contents: write
      pull-requests: read
