# TODO: replace OWNER/docengine with the final engine repository owner/name, and pin a released tag instead of v1.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: OWNER/docengine/.github/workflows/release.yml@v1
    with:
      engine-repository: OWNER/docengine
      engine-ref: v1
    permissions:
      contents: write
      pull-requests: read